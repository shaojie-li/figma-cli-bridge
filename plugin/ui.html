<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:12px/1.4 system-ui;margin:12px;color:var(--figma-color-text,#202936);background:var(--figma-color-bg,#fff)}
header{display:flex;align-items:center;gap:6px;height:24px}#dot{width:6px;height:6px;border-radius:50%;background:#7d8793;flex:none}body[data-state=ready] #dot{background:#187345}body[data-state=busy] #dot{background:#3659c9}body[data-state=action] #dot{background:#b73540}
#title{font-weight:500;flex:1;white-space:nowrap}button{font:inherit;border:0;border-radius:4px;padding:4px 6px;background:var(--figma-color-bg-secondary,#f0f2f5);color:inherit;cursor:pointer;white-space:nowrap}button:hover{background:var(--figma-color-bg-hover,#e7ebf0)}button:focus-visible,input:focus-visible{outline:2px solid #3659c9;outline-offset:1px}
#detail{font-size:11px;line-height:16px;margin:6px 0 0;color:var(--figma-color-text-secondary,#556171);overflow-wrap:anywhere;max-height:40px;overflow:auto}#panel{margin-top:12px;border-top:1px solid var(--figma-color-border,#dce1e7);padding-top:10px}label{display:block;margin-bottom:4px}input{width:100%;font:inherit;padding:6px;border:1px solid var(--figma-color-border,#a4aebb);border-radius:4px;color:inherit;background:inherit}#connect{margin-top:8px;width:100%}small{display:block;margin-top:8px;font-size:10px;color:var(--figma-color-text-secondary,#556171)}[hidden]{display:none!important}

#title{min-width:0;overflow:hidden;text-overflow:ellipsis}
#theme-picker{position:relative;display:inline-flex;flex:none;align-items:center}
#theme{appearance:none;box-sizing:border-box;width:96px;height:26px;padding:0 17px 0 21px;border:1px solid var(--figma-color-border,#d8dce3);border-radius:6px;background:var(--figma-color-bg-secondary,#f5f6f8);color:var(--figma-color-text,#242932);font:500 11px/1.2 system-ui;cursor:pointer;text-overflow:ellipsis}
#theme:hover{border-color:var(--figma-color-border-strong,#a8afb9)}
#theme:focus-visible{outline:2px solid var(--figma-color-border-selected,#4976be);outline-offset:1px}
#theme-picker::before{content:"";position:absolute;left:8px;width:8px;height:8px;border:1px solid currentColor;border-radius:50%;background:linear-gradient(90deg,currentColor 50%,transparent 50%);opacity:.7;pointer-events:none}
#theme-picker::after{content:"";position:absolute;right:8px;width:4px;height:4px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:translateY(-1px) rotate(45deg);opacity:.7;pointer-events:none}
.figma-dark{color-scheme:dark}
</style><body data-state="connecting"><header><span id="dot" aria-hidden="true"></span><strong id="title" role="status">正在连接</strong><span id="theme-picker" hidden><select id="theme" aria-label="画板主题"></select></span><button id="toggle" type="button">暂停</button><button id="settings" type="button" aria-expanded="false" aria-controls="panel">设置</button></header><p id="detail" aria-live="polite" hidden></p><section id="panel" hidden><label for="token">本机配对码</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect" type="button">更新配对并连接</button><small>v0.7.4 · 仅 localhost:38475<br>连接后，本机 CLI 可读写已绑定的 Sandbox。</small></section><script>__UI_SCRIPT__</script></body></html>
