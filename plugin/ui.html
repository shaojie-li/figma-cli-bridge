<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:12px/1.4 system-ui;margin:12px;color:var(--figma-color-text,#202936);background:var(--figma-color-bg,#fff)}
header{display:flex;align-items:center;gap:6px;height:24px}#dot{width:6px;height:6px;border-radius:50%;background:#7d8793;flex:none}body[data-state=ready] #dot{background:#187345}body[data-state=busy] #dot{background:#3659c9}body[data-state=action] #dot{background:#b73540}
#title{font-weight:500;flex:1;white-space:nowrap}button{font:inherit;border:0;border-radius:4px;padding:4px 6px;background:var(--figma-color-bg-secondary,#f0f2f5);color:inherit;cursor:pointer;white-space:nowrap}button:hover{background:var(--figma-color-bg-hover,#e7ebf0)}button:focus-visible,input:focus-visible{outline:2px solid #3659c9;outline-offset:1px}
#detail{font-size:11px;line-height:16px;margin:6px 0 0;color:var(--figma-color-text-secondary,#556171);overflow-wrap:anywhere;max-height:40px;overflow:auto}#panel{margin-top:12px;border-top:1px solid var(--figma-color-border,#dce1e7);padding-top:10px}label{display:block;margin-bottom:4px}input{width:100%;font:inherit;padding:6px;border:1px solid var(--figma-color-border,#a4aebb);border-radius:4px;color:inherit;background:inherit}#connect{margin-top:8px;width:100%}small{display:block;margin-top:8px;font-size:10px;color:var(--figma-color-text-secondary,#556171)}[hidden]{display:none!important}
</style><body data-state="connecting"><header><span id="dot" aria-hidden="true"></span><strong id="title" role="status">正在连接</strong><button id="toggle" type="button">暂停</button><button id="settings" type="button" aria-expanded="false" aria-controls="panel">设置</button></header><p id="detail" aria-live="polite" hidden></p><section id="panel" hidden><label for="token">本机配对码</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect" type="button">更新配对并连接</button><small>v0.7.3 · 仅 localhost:38475<br>连接后，本机 CLI 可读写已绑定的 Sandbox。</small></section><script>__UI_SCRIPT__</script></body></html>
