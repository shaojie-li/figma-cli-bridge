name: Verify and publish release ZIP

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $TAG must point to a commit on main" >&2
            exit 1
          fi
          download="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/figma-cli-bridge-$version.zip"
          if ! grep -Fq "$download)" docs/INSTALL.en.md; then
            echo "Update the ZIP download link in docs/INSTALL.en.md for $TAG" >&2
            exit 1
          fi
      - name: Package and verify installation
        run: |
          python3 scripts/install-global-skill.py --package
          npm run test:zip
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-files
          path: |
            release/figma-cli-bridge-*.zip
            docs/INSTALL.en.md
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "Release $TAG is already published"
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes \
              --title "Figma CLI Bridge ${TAG#v}"
          fi
          gh release upload "$TAG" "release/figma-cli-bridge-${TAG#v}.zip" docs/INSTALL.en.md --clobber
          gh release edit "$TAG" --draft=false
