name: Verify and publish release ZIP

on:
  push:
    branches: [main]

concurrency:
  group: main-release
  queue: max

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve release version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/prepare-release.py "$BEFORE" >> "$GITHUB_OUTPUT"
      - name: Test and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm test
          python3 scripts/test-skill-updates.py
          python3 scripts/install-global-skill.py --package
          npm run test:zip
          download="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/figma-cli-bridge-$VERSION.zip"
          grep -Fq "$download)" docs/INSTALL.en.md
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          name: release-files
          path: |
            release/figma-cli-bridge-${{ steps.version.outputs.version }}.zip
            docs/INSTALL.en.md
          if-no-files-found: error

  publish:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Publish the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$VERSION"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft) && [[ "$draft" == false ]]; then
            echo "$tag is already published."
            exit 0
          fi
          if sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha); then
            [[ "$sha" == "$GITHUB_SHA" ]] || { echo "Existing tag belongs to another commit" >&2; exit 1; }
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if [[ "$draft" != true ]]; then
            gh release create "$tag" --verify-tag --draft --generate-notes --title "Figma CLI Bridge $VERSION"
          fi
          gh release upload "$tag" "release/figma-cli-bridge-$VERSION.zip" docs/INSTALL.en.md --clobber
          gh release edit "$tag" --draft=false
